<div class="product-container">
  <h2>Product Inventory Management</h2>

  <!-- Add New Product Card -->
  <div class="add-product-card">
    <h3>Add New Product</h3>
    <form (ngSubmit)="addProduct()" class="product-form-grid">
      <div class="form-group">
        <label for="name">Name</label>
        <input
          id="name"
          type="text"
          placeholder="e.g. Mechanical Keyboard"
          [(ngModel)]="newProduct.name"
          name="name"
          required
        />
      </div>

      <div class="form-group">
        <label for="description">Description</label>
        <input
          id="description"
          type="text"
          placeholder="Optional details..."
          [(ngModel)]="newProduct.description"
          name="description"
        />
      </div>

      <div class="form-group">
        <label for="price">Price (€)</label>
        <input
          id="price"
          type="number"
          placeholder="0.00"
          [(ngModel)]="newProduct.price"
          name="price"
          step="0.01"
          min="0"
          required
        />
      </div>

      <div class="form-group">
        <label for="stock">Stock</label>
        <input
          id="stock"
          type="number"
          placeholder="0"
          [(ngModel)]="newProduct.stock"
          name="stock"
          min="0"
          required
        />
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-save">Save Product</button>
      </div>
    </form>
  </div>

  <!-- Search & Controls Bar -->
  <div class="controls-bar">
    <input
      type="text"
      placeholder="Search products by name..."
      [(ngModel)]="searchQuery"
      (input)="onSearch()"
      class="search-input"
    />
    <button class="btn-refresh" (click)="loadProducts()">Refresh List</button>
  </div>

  <!-- Error / Success Messages -->
  <div *ngIf="errorMessage()" class="alert error">{{ errorMessage() }}</div>

  <!-- Loading State -->
  <div *ngIf="loading()" class="loading">Loading products...</div>

  <!-- Products Table -->
  <table *ngIf="!loading()" class="product-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Description</th>
        <th>Price</th>
        <th>Stock</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let product of products()">
        <td>{{ product.id }}</td>
        <td>
          <strong>{{ product.name }}</strong>
        </td>
        <td>{{ product.description || '—' }}</td>
        <td>{{ product.price | currency: 'EUR' }}</td>
        <td>
          <span [class.low-stock]="product.stock < 5" class="stock-badge">
            {{ product.stock }}
          </span>
        </td>
        <td class="actions-cell">
          <button class="btn-sm btn-inc" (click)="adjustStock(product.id, 1, true)" title="Add 1">
            +1
          </button>
          <button
            class="btn-sm btn-dec"
            (click)="adjustStock(product.id, 1, false)"
            title="Decrement 1"
            [disabled]="product.stock <= 0"
          >
            -1
          </button>
          <button class="btn-sm btn-del" (click)="deleteProduct(product.id)">Delete</button>
        </td>
      </tr>
      <tr *ngIf="products().length === 0">
        <td colspan="6" class="no-data">No products found.</td>
      </tr>
    </tbody>
  </table>
</div>
